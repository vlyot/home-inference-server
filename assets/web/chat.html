<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat — Home Inference Server</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    font-size: 13px;
    background: #0d0d0f;
    color: #d4d4d8;
    display: flex;
    flex-direction: column;
    padding: 24px;
    gap: 16px;
  }

  header {
    display: flex;
    align-items: baseline;
    gap: 16px;
    border-bottom: 1px solid #27272a;
    padding-bottom: 16px;
    flex-shrink: 0;
  }

  header h1 { font-size: 16px; font-weight: 600; color: #f4f4f5; }
  .meta { color: #71717a; font-size: 12px; }
  .navlink { font-size: 11px; color: #71717a; text-decoration: none; }
  .navlink:hover { color: #d4d4d8; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; display: inline-block; margin-right: 6px; }
  .dot.stale { background: #ef4444; }
  #tier-info { margin-left: auto; font-size: 11px; color: #71717a; }
  #save-state { font-size: 11px; color: #a16207; }

  .layout {
    display: flex;
    gap: 16px;
    flex: 1;
    min-height: 0;
  }

  aside {
    width: 220px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow-y: auto;
  }

  .new-chat {
    background: #18181b;
    border: 1px solid #27272a;
    border-radius: 6px;
    color: #f4f4f5;
    padding: 8px 12px;
    font: inherit;
    cursor: pointer;
    text-align: left;
  }
  .new-chat:hover { border-color: #3f3f46; }

  .chat-item {
    background: #18181b;
    border: 1px solid #27272a;
    border-radius: 6px;
    padding: 8px 12px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .chat-item:hover { border-color: #3f3f46; }
  .chat-item.active { border-color: #2563eb; background: #12203c; }
  .chat-item .title { color: #d4d4d8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chat-item .when { color: #71717a; font-size: 11px; }
  .chat-empty { color: #52525b; padding: 8px 12px; font-size: 12px; }

  .conversation {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    background: #121214;
    border: 1px solid #27272a;
    border-radius: 6px;
    overflow: hidden;
  }

  #thread {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .msg { display: flex; }
  .msg-user { justify-content: flex-end; }
  .msg-assistant, .msg-error { justify-content: flex-start; }

  .bubble {
    max-width: 72ch;
    padding: 10px 14px;
    border-radius: 8px;
    word-break: break-word;
    line-height: 1.5;
  }
  /* Plain-text bubbles (user turns, errors) rely on whitespace for line
     breaks. Rendered-markdown bubbles (.md) get real block elements instead —
     pre-wrap there would double up spacing around them. */
  .bubble:not(.md) { white-space: pre-wrap; }
  .msg-user .bubble { background: #172554; color: #bfdbfe; }
  .msg-assistant .bubble { background: #18181b; border: 1px solid #27272a; color: #d4d4d8; }
  .msg-error .bubble { background: #450a0a; color: #fca5a5; }

  /* Markdown typography for rendered assistant replies. */
  .bubble.md > *:first-child { margin-top: 0; }
  .bubble.md > *:last-child { margin-bottom: 0; }
  .bubble.md p { margin: 0.6em 0; }
  .bubble.md h1, .bubble.md h2, .bubble.md h3, .bubble.md h4 {
    margin: 1em 0 0.4em;
    line-height: 1.3;
    color: #f4f4f5;
  }
  .bubble.md h1 { font-size: 1.25em; }
  .bubble.md h2 { font-size: 1.15em; }
  .bubble.md h3, .bubble.md h4 { font-size: 1.05em; }
  .bubble.md ul, .bubble.md ol { margin: 0.5em 0; padding-left: 1.4em; }
  .bubble.md li { margin: 0.2em 0; }
  .bubble.md li > p { margin: 0.2em 0; }
  .bubble.md a { color: #93c5fd; }
  .bubble.md strong { color: #f4f4f5; font-weight: 600; }
  .bubble.md hr { border: none; border-top: 1px solid #27272a; margin: 1em 0; }
  .bubble.md blockquote {
    margin: 0.6em 0;
    padding: 2px 12px;
    border-left: 2px solid #3f3f46;
    color: #a1a1aa;
  }
  .bubble.md code {
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    font-size: 0.9em;
    background: #27272a;
    padding: 1px 5px;
    border-radius: 4px;
  }
  .bubble.md pre {
    margin: 0.6em 0;
    padding: 10px 12px;
    background: #0d0d0f;
    border: 1px solid #27272a;
    border-radius: 6px;
    overflow-x: auto;
  }
  .bubble.md pre code { background: none; padding: 0; border-radius: 0; }
  .bubble.md table {
    margin: 0.6em 0;
    border-collapse: collapse;
    width: 100%;
    font-size: 0.95em;
  }
  .bubble.md th, .bubble.md td {
    border: 1px solid #27272a;
    padding: 5px 10px;
    text-align: left;
  }
  .bubble.md th { background: #121214; color: #f4f4f5; }

  .thinking {
    max-width: 72ch;
    margin-bottom: 6px;
    font-size: 12px;
    color: #a1a1aa;
  }
  .thinking summary {
    cursor: pointer;
    color: #71717a;
    list-style: none;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .thinking summary::before { content: "💡"; font-size: 11px; }
  .thinking summary::-webkit-details-marker { display: none; }
  .thinking[open] summary { color: #a1a1aa; }
  .thinking-body {
    margin-top: 6px;
    padding: 8px 12px;
    border-left: 2px solid #27272a;
    white-space: pre-wrap;
    word-break: break-word;
    color: #71717a;
  }

  .typing .bubble::after {
    content: "···";
    letter-spacing: 2px;
    animation: blink 1.2s steps(3, end) infinite;
  }

  .truncated-note {
    margin-top: 8px;
    padding-top: 6px;
    border-top: 1px dashed #451a03;
    font-size: 11px;
    color: #fbbf24;
  }
  @keyframes blink { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

  .thread-empty {
    margin: auto;
    color: #52525b;
    text-align: center;
  }

  #ctx-warn {
    background: #1c1409;
    border-top: 1px solid #78350f;
    color: #fdba74;
    padding: 8px 16px;
    font-size: 12px;
  }

  #composer {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 12px;
    border-top: 1px solid #27272a;
    align-items: flex-end;
  }

  /* Staged-image chip sits on its own row above the input (full width). */
  #staged[hidden] { display: none; }
  #staged {
    flex-basis: 100%;
    display: flex;
    align-items: center;
    gap: 8px;
    background: #18181b;
    border: 1px solid #27272a;
    border-radius: 6px;
    padding: 6px 8px;
    font-size: 12px;
    color: #a1a1aa;
  }
  #staged img { width: 40px; height: 40px; object-fit: cover; border-radius: 4px; }
  #staged .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #staged button {
    background: none;
    border: none;
    color: #71717a;
    cursor: pointer;
    font: inherit;
    padding: 2px 6px;
  }
  #staged button:hover { color: #fca5a5; }

  #attach { color: #a1a1aa; }
  .bubble .thumb {
    display: block;
    max-width: 240px;
    max-height: 240px;
    border-radius: 6px;
    margin-bottom: 6px;
  }
  .bubble .img-placeholder {
    display: inline-block;
    margin-right: 6px;
    opacity: 0.7;
  }

  #input {
    flex: 1;
    resize: none;
    background: #0d0d0f;
    border: 1px solid #27272a;
    border-radius: 6px;
    color: #d4d4d8;
    font: inherit;
    padding: 8px 10px;
    max-height: 140px;
    line-height: 1.5;
    overflow-y: auto;
    scrollbar-width: none;       /* Firefox */
    -ms-overflow-style: none;    /* old Edge/IE */
  }
  #input::-webkit-scrollbar { display: none; } /* Chrome/Edge/Safari */
  #input:focus { outline: none; border-color: #3f3f46; }

  select, #composer button {
    background: #18181b;
    border: 1px solid #27272a;
    border-radius: 6px;
    color: #d4d4d8;
    font: inherit;
    padding: 8px 12px;
    cursor: pointer;
  }
  #composer button:hover, select:hover { border-color: #3f3f46; }
  #send { color: #f4f4f5; }
  #send:disabled { opacity: 0.4; cursor: not-allowed; }
  #delete-chat { color: #fca5a5; }
</style>
<script src="/vendor/marked.min.js"></script>
<script src="/vendor/dompurify.min.js"></script>
</head>
<body>

<header>
  <span class="dot" id="dot"></span>
  <h1>Chat</h1>
  <a class="navlink" href="/">← Dashboard</a>
  <a class="navlink" href="/logs">Logs →</a>
  <a class="navlink" href="/docs">API Docs →</a>
  <span id="save-state" hidden>not saved</span>
  <span id="tier-info">—</span>
</header>

<div class="layout">
  <aside>
    <button class="new-chat" id="new-chat">+ New Chat</button>
    <div id="chat-list"></div>
  </aside>

  <div class="conversation">
    <div id="thread"><div class="thread-empty">Start a conversation below.</div></div>
    <div id="ctx-warn" hidden>This chat is getting long. The model will soon start to lose track of the earlier messages — start a New Chat when you can.</div>
    <form id="composer">
      <div id="staged" hidden>
        <img id="staged-thumb" alt="">
        <span class="name" id="staged-name"></span>
        <button type="button" id="staged-clear" title="Remove image">✕</button>
      </div>
      <input type="file" id="file" accept="image/*" hidden>
      <button type="button" id="attach" title="Attach an image">📎</button>
      <textarea id="input" rows="1" placeholder="Message the model…  (Enter to send, Shift+Enter for newline)"></textarea>
      <select id="tier" title="Model tier — forces which model answers, overriding automatic VRAM-based selection">
        <option value="">auto</option>
        <option value="weak">weak (lfm2-vl-3b — smallest, lowest VRAM, vision-capable)</option>
        <option value="mid">mid (gemma-4-e2b)</option>
        <option value="strong">strong (gemma-4-e4b — largest, best quality)</option>
      </select>
      <button type="submit" id="send">Send</button>
      <button type="button" id="delete-chat">Delete chat</button>
    </form>
  </div>
</div>

<script>
  const $ = id => document.getElementById(id);

  let convId = null;
  let messages = [];
  let streaming = false;
  let nCtx = 4096;
  let stagedImage = null; // { b64, dataURL, name } while an image is attached but unsent

  // Prefixes that mark the two message kinds a folded image produces. The
  // description turn is context the model reads but the user never sees; the
  // "[image attached]" turn renders as a chip. Both are plain ChatMessages so
  // they persist and reload without any schema change.
  //
  // The description turn is pushed with role 'assistant', not 'user': a
  // reasoning model reading "(image description: ...)" as its own prior turn
  // treats it as its own remembered perception of the photo and answers
  // naturally in the first person. Pushed as a 'user' turn instead, it reads
  // as a document the user handed over for analysis — the model then talks
  // about "the description you provided" and "since the description cuts
  // off..." instead of just answering as if it saw the photo. The prefix
  // still needs to be a marker for hiding it from the transcript UI and
  // stripping it before persistence.
  const IMG_DESC_PREFIX = '(image description: ';
  const IMG_TURN_PREFIX = '[image attached] ';

  // Appended to a truncated assistant turn's persisted content so a reload
  // can still show the cut-short indicator (rebuildThread strips the suffix
  // before rendering the text and re-adds the note instead).
  const TRUNCATED_SUFFIX = '\n\n[response cut short]';

  const MAX_IMAGE_BYTES = 8 * 1024 * 1024;

  function stageImage(file) {
    if (!file.type.startsWith('image/')) { alert('Please choose an image file.'); return; }
    if (file.size > MAX_IMAGE_BYTES) { alert('Image is too large (max 8 MB).'); return; }
    const reader = new FileReader();
    reader.onload = () => {
      const dataURL = reader.result;
      const b64 = String(dataURL).split(',', 2)[1] || '';
      stagedImage = { b64, dataURL, name: file.name };
      $('staged-thumb').src = dataURL;
      $('staged-name').textContent = file.name;
      $('staged').hidden = false;
      $('input').focus();
    };
    reader.readAsDataURL(file);
  }

  function clearStagedImage() {
    stagedImage = null;
    $('file').value = '';
    $('staged-thumb').src = '';
    $('staged-name').textContent = '';
    $('staged').hidden = true;
  }

  async function describeImage(b64) {
    const r = await fetch('/v1/describe', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image_base64: b64 }),
    });
    if (!r.ok) {
      let code = 'HTTP ' + r.status;
      try { const e = await r.json(); code = e.code || code; } catch (_) { /* keep */ }
      throw new Error(errorText(code));
    }
    return r.json();
  }

  function relTime(iso) {
    const s = Math.floor((Date.now() - new Date(iso)) / 1000);
    if (s < 60) return `${s}s ago`;
    if (s < 3600) return `${Math.floor(s / 60)}m ago`;
    if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
    return `${Math.floor(s / 86400)}d ago`;
  }

  function clearThread() {
    $('thread').innerHTML = '<div class="thread-empty">Start a conversation below.</div>';
  }

  // renderMarkdown converts assistant-generated markdown to sanitized HTML.
  // marked.parse produces HTML from the model's raw text; DOMPurify strips
  // anything unsafe (script tags, event-handler attributes, javascript: URLs)
  // before it ever touches the DOM — required because this text originates
  // from the model, not a trusted source, and a crafted prompt could induce
  // HTML/script-like output.
  function renderMarkdown(text) {
    const html = marked.parse(text, { breaks: true });
    return DOMPurify.sanitize(html);
  }

  function appendMessage(role, content) {
    const empty = $('thread').querySelector('.thread-empty');
    if (empty) empty.remove();
    const wrap = document.createElement('div');
    wrap.className = `msg msg-${role}`;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    if (role === 'assistant') {
      bubble.classList.add('md');
      bubble.innerHTML = renderMarkdown(content);
    } else {
      bubble.textContent = content;
    }
    wrap.appendChild(bubble);
    $('thread').appendChild(wrap);
    $('thread').scrollTop = $('thread').scrollHeight;
    return bubble;
  }

  // appendImageMessage renders a user turn that carried an image: a thumbnail
  // (live session only — dataURL is null after reload) plus the question text.
  function appendImageMessage(dataURL, text) {
    const empty = $('thread').querySelector('.thread-empty');
    if (empty) empty.remove();
    const wrap = document.createElement('div');
    wrap.className = 'msg msg-user';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    if (dataURL) {
      const img = document.createElement('img');
      img.className = 'thumb';
      img.src = dataURL;
      img.alt = 'attached image';
      bubble.appendChild(img);
    } else {
      const ph = document.createElement('span');
      ph.className = 'img-placeholder';
      ph.textContent = '🖼';
      bubble.appendChild(ph);
    }
    bubble.appendChild(document.createTextNode(text));
    wrap.appendChild(bubble);
    $('thread').appendChild(wrap);
    $('thread').scrollTop = $('thread').scrollHeight;
  }

  function showTyping() {
    const empty = $('thread').querySelector('.thread-empty');
    if (empty) empty.remove();
    const wrap = document.createElement('div');
    wrap.className = 'msg msg-assistant typing';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    wrap.appendChild(bubble);
    $('thread').appendChild(wrap);
    $('thread').scrollTop = $('thread').scrollHeight;
    return wrap;
  }

  function rebuildThread() {
    $('thread').innerHTML = '';
    if (messages.length === 0) { clearThread(); return; }
    // Index-based (not for..of) because the image marker turn and the
    // question that follows it render as a single bubble — rendering that
    // pair has to consume two array entries at once.
    for (let i = 0; i < messages.length; i++) {
      const m = messages[i];
      if (m._hidden || m.content.startsWith(IMG_DESC_PREFIX)) continue; // context only
      if (m.content.startsWith(IMG_TURN_PREFIX)) {
        // The question is the next non-hidden turn (skipping the folded
        // description turn in between, if present).
        let j = i + 1;
        while (j < messages.length && (messages[j]._hidden || messages[j].content.startsWith(IMG_DESC_PREFIX))) j++;
        const questionText = j < messages.length ? messages[j].content : '';
        appendImageMessage(m._image || null, questionText);
        i = j; // skip the consumed question turn
        continue;
      }
      const truncated = m.role === 'assistant' && m.content.endsWith(TRUNCATED_SUFFIX);
      const text = truncated ? m.content.slice(0, -TRUNCATED_SUFFIX.length) : m.content;
      const bubble = appendMessage(m.role === 'assistant' ? 'assistant' : m.role === 'user' ? 'user' : 'assistant', text);
      if (truncated) {
        const note = document.createElement('div');
        note.className = 'truncated-note';
        note.textContent = '⚠ Response cut short — the model stopped unexpectedly.';
        bubble.appendChild(note);
      }
    }
  }

  async function updateCtxWarn() {
    if (messages.length === 0) { $('ctx-warn').hidden = true; return; }
    try {
      const transcript = messages.map(m => m.role + ': ' + m.content).join('\n');
      const r = await fetch('/v1/tokenize', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: transcript }),
      });
      if (!r.ok) return;
      const d = await r.json();
      if (d.n_ctx) nCtx = d.n_ctx;
      const used = d.tokens + 8 * messages.length;
      const usable = nCtx - 512;
      $('ctx-warn').hidden = !(used >= usable * 0.85);
    } catch (e) { /* leave banner as-is */ }
  }

  async function streamAssistant(preferredTier) {
    const typing = showTyping();
    let bubble = null;
    let thinkingBody = null;
    let acc = '';
    let reasoningAcc = '';
    let buf = '';
    let sawError = false;
    // Truncated: the backend produced real content, then failed mid-stream
    // (e.g. a subprocess crash) before finishing. Not an error — what
    // streamed is genuine model output and is kept, just marked incomplete.
    let sawTruncated = false;

    // Lazily inserts (once) the collapsible "Thinking…" block right before
    // the typing/answer bubble, open while streaming so reasoning is visible
    // as it arrives, matching llama-server's own chat UI.
    function ensureThinkingBlock() {
      if (thinkingBody) return;
      const empty = $('thread').querySelector('.thread-empty');
      if (empty) empty.remove();
      const details = document.createElement('details');
      details.className = 'thinking';
      details.open = true;
      const summary = document.createElement('summary');
      summary.textContent = 'Thinking…';
      thinkingBody = document.createElement('div');
      thinkingBody.className = 'thinking-body';
      details.appendChild(summary);
      details.appendChild(thinkingBody);
      $('thread').insertBefore(details, typing);
      $('thread').scrollTop = $('thread').scrollHeight;
    }

    try {
      const res = await fetch('/v1/infer', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          modality: 'text',
          text_input: { messages },
          stream: true,
          preferred_tier: preferredTier || undefined,
        }),
      });
      if (!res.ok || !res.body) throw new Error('HTTP ' + res.status);

      const reader = res.body.getReader();
      const decoder = new TextDecoder();

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        const lines = buf.split('\n');
        buf = lines.pop();
        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const payload = line.slice(6);
          if (payload === '[DONE]') continue;
          let chunk;
          try { chunk = JSON.parse(payload); } catch (e) { continue; }
          if (chunk.error) { sawError = true; throw new Error(errorText(chunk.error)); }
          if (chunk.truncated) sawTruncated = true;
          if (chunk.reasoning) {
            ensureThinkingBlock();
            reasoningAcc += chunk.reasoning;
            thinkingBody.textContent = reasoningAcc;
            $('thread').scrollTop = $('thread').scrollHeight;
          }
          if (chunk.delta) {
            if (!bubble) {
              typing.remove();
              bubble = appendMessage('assistant', '');
              if (thinkingBody) thinkingBody.closest('.thinking').open = false;
            }
            acc += chunk.delta;
            bubble.innerHTML = renderMarkdown(acc);
            $('thread').scrollTop = $('thread').scrollHeight;
          }
        }
      }

      if (acc === '' && !sawError) {
        if (bubble) bubble.parentElement.remove(); else typing.remove();
        if (thinkingBody) thinkingBody.closest('.thinking').remove();
        throw new Error(errorText(reasoningAcc ? 'reasoning_exhausted' : 'internal_error'));
      }
      if (sawTruncated && bubble) {
        const note = document.createElement('div');
        note.className = 'truncated-note';
        note.textContent = '⚠ Response cut short — the model stopped unexpectedly.';
        bubble.appendChild(note);
      }
      messages.push({ role: 'assistant', content: acc + (sawTruncated ? TRUNCATED_SUFFIX : '') });
    } catch (e) {
      typing.remove();
      if (thinkingBody) thinkingBody.closest('.thinking').remove();
      appendMessage('error', 'Request failed: ' + e.message);
      throw e;
    }
  }

  async function sendMessage() {
    const text = $('input').value.trim();
    if (!text || streaming) return;
    streaming = true;
    $('send').disabled = true;

    const img = stagedImage; // capture; may be null
    let addedTurns = 1;      // how many entries to pop from messages on failure

    if (img) {
      // Fold the image into the conversation: run the perception hop, then
      // push three turns that keep strict user/assistant alternation so the
      // model treats the description as its own remembered perception rather
      // than a document to analyze:
      //   1. user   — "[image attached]" marker (no question text; the
      //               question is its own turn below)
      //   2. assistant (hidden) — the folded description, in the model's own
      //               voice ("what it saw")
      //   3. user   — the actual question text
      // The visible chip bubble still shows image + question together
      // (appendImageMessage) even though the wire messages split them.
      $('send').textContent = 'Reading image…';
      let desc;
      try {
        const d = await describeImage(img.b64);
        desc = d.description || '';
      } catch (e) {
        appendMessage('error', 'Could not read the image: ' + e.message);
        streaming = false;
        $('send').disabled = false;
        $('send').textContent = 'Send';
        return;
      }
      $('send').textContent = 'Send';

      messages.push({ role: 'user', content: IMG_TURN_PREFIX, _image: img.dataURL });
      messages.push({ role: 'assistant', content: IMG_DESC_PREFIX + desc + ')', _hidden: true });
      messages.push({ role: 'user', content: text });
      appendImageMessage(img.dataURL, text);
      clearStagedImage();
      addedTurns = 3;
    } else {
      messages.push({ role: 'user', content: text });
      appendMessage('user', text);
    }

    $('input').value = '';
    autoGrow();

    try {
      await streamAssistant($('tier').value);
      await persist();
    } catch (e) {
      // Error bubble already shown. Drop the unanswered turn(s) and restore the
      // text so the send can be retried without doubling the history.
      for (let i = 0; i < addedTurns; i++) messages.pop();
      rebuildThread();
      $('input').value = text;
      autoGrow();
    } finally {
      streaming = false;
      $('send').disabled = false;
      $('send').textContent = 'Send';
      refreshStatus();
      refreshList();
      updateCtxWarn();
      $('input').focus();
    }
  }

  async function persist() {
    if (messages.length === 0) return;
    if (!convId) convId = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())).replace(/-/g, '');
    // Strip client-only fields (_image data URLs, _hidden flags) — only
    // {role, content} is persisted. The content prefixes let load() re-derive
    // which turns are the folded-image pair.
    const wire = messages.map(m => ({ role: m.role, content: m.content }));
    try {
      const r = await fetch('/v1/chats/' + convId, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: wire }),
      });
      $('save-state').hidden = r.ok;
    } catch (e) {
      $('save-state').hidden = false;
    }
  }

  async function loadConversation(id) {
    try {
      const r = await fetch('/v1/chats/' + id);
      if (!r.ok) return;
      const c = await r.json();
      convId = c.id;
      messages = (c.messages || []).map(m => ({ role: m.role, content: m.content }));
      rebuildThread();
      await updateCtxWarn();
      refreshList();
    } catch (e) { /* ignore */ }
  }

  function newConversation() {
    convId = null;
    messages = [];
    clearStagedImage();
    clearThread();
    $('ctx-warn').hidden = true;
    $('save-state').hidden = true;
    refreshList();
    $('input').focus();
  }

  async function deleteConversation() {
    if (convId) {
      try { await fetch('/v1/chats/' + convId, { method: 'DELETE' }); } catch (e) { /* ignore */ }
    }
    newConversation();
  }

  async function refreshList() {
    try {
      const r = await fetch('/v1/chats');
      if (!r.ok) return;
      const list = await r.json();
      const el = $('chat-list');
      if (!list || list.length === 0) {
        el.innerHTML = '<div class="chat-empty">No saved chats</div>';
        return;
      }
      el.innerHTML = list.map(c => `
        <div class="chat-item${c.id === convId ? ' active' : ''}" data-id="${c.id}">
          <span class="title">${escapeHtml(c.title || 'untitled')}</span>
          <span class="when">${relTime(c.updated_at)}</span>
        </div>
      `).join('');
      el.querySelectorAll('.chat-item').forEach(node => {
        node.addEventListener('click', () => loadConversation(node.dataset.id));
      });
    } catch (e) { /* ignore */ }
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function errorText(code) {
    if (code === 'overloaded') return 'the server is under heavy load right now — try again shortly, or pick a smaller model tier';
    if (code === 'timeout') return 'the request timed out';
    if (code === 'model_load_failed' || code === 'unavailable') return 'the model backend is unavailable';
    if (code === 'internal_error') return 'the model produced no output — it may still be loading, try again in a moment';
    if (code === 'reasoning_exhausted') return 'the model spent its whole reply budget thinking and never answered — try again, or ask something more specific';
    return code;
  }

  async function refreshStatus() {
    try {
      const r = await fetch('/v1/status');
      if (!r.ok) throw new Error(r.status);
      const d = await r.json();
      $('dot').className = 'dot';
      const desc = d.loaded_model && d.loaded_model.descriptor;
      const label = desc
        ? (desc.name && desc.tier_label ? `${desc.name} (${desc.tier_label})` : desc.tier_label || desc.name)
        : 'idle';
      const tps = d.tokens_per_sec && d.tokens_per_sec > 0 ? d.tokens_per_sec.toFixed(1) + ' tok/s' : '—';
      $('tier-info').textContent = `${label} · ${tps}`;
    } catch (e) {
      $('dot').className = 'dot stale';
    }
  }

  function autoGrow() {
    const el = $('input');
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 140) + 'px';
  }

  $('composer').addEventListener('submit', e => { e.preventDefault(); sendMessage(); });
  $('input').addEventListener('input', autoGrow);
  $('input').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
  $('new-chat').addEventListener('click', newConversation);
  $('delete-chat').addEventListener('click', deleteConversation);
  $('attach').addEventListener('click', () => $('file').click());
  $('file').addEventListener('change', e => { if (e.target.files[0]) stageImage(e.target.files[0]); });
  $('staged-clear').addEventListener('click', clearStagedImage);

  // n_ctx is picked up from the first /v1/tokenize call (updateCtxWarn) — no
  // need to hit /v1/model/props on load, which used to force a cold model spawn.
  refreshList();
  refreshStatus();
  setInterval(refreshStatus, 5000);
  $('input').focus();
</script>
</body>
</html>
